name: business-center

on:
  push:
    paths: ["business-center/**", ".github/workflows/business-center.yml"]
  pull_request:
    paths: ["business-center/**", ".github/workflows/business-center.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: business-center/backend } }
    env:
      BC_TEST_ADMIN_DSN: host=localhost port=5432 user=postgres password=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: business-center/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: business-center/frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
