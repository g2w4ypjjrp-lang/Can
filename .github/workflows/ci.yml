name: CI

# Özel depoda GitHub Actions dakikaları aylık kotayla sınırlıdır (Windows dakikası 2, macOS dakikası
# 10 dakika sayılır). Bu yüzden her gönderimde yalnızca Linux işleri çalışır. Windows motor testleri
# windows.yml'de (yalnızca motor değişince), kurulum paketi ve iPhone testleri elle başlatılır
# ("Run workflow"). `ana` dalı yalnızca burada yeşil olmuş işlemeye ileri sarılır; aynı işleme
# orada yeniden test edilmez.
on:
  push:
    branches-ignore: [ana]
    paths:
      - "engine/**"
      - "cloud/**"
      - "shared/**"
      - "deploy/cloud.env.example"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Motor (Linux, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # Ürün Python 3.13 ile paketlenir (desktop.yml). En düşük desteklenen sürüm (3.12) elle
        # çalıştırmada sınanır. Windows testleri: windows.yml.
        python: ${{ fromJSON(github.event_name == 'push' && '["3.13"]' || '["3.12", "3.13"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  cloud:
    name: Bulut servisi (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ati_test
          POSTGRES_PASSWORD: ati_test
          POSTGRES_DB: ati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ATI_TEST_DATABASE_URL: postgresql://ati_test:ati_test@127.0.0.1:5432/ati_test
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Yük testi (duman; lisans uç noktaları ve aktarma servisi, gerçek sunucular)
        run: uv run python scripts/load_test.py --quick
      - name: Felaket kurtarma tatbikatı (pg_dump → pg_restore → iş sürekliliği)
        run: |
          pg_dump --version
          uv run python scripts/dr_drill.py
      # Sunucudaki kurulumun aynısı (deploy/windows-sunucu/kur.ps1: --no-dev --no-editable): üretim
      # kodu yalnızca geliştirme ortamında bulunan bir pakete dayanıyorsa servisler burada açılmaz.
      - name: Yalnızca üretim bağımlılıklarıyla açılış (geçişler, API, aktarma servisi)
        env:
          PGPASSWORD: ati_test
          ATI_DATABASE_URL: postgresql://ati_test:ati_test@127.0.0.1:5432/ati_uretim_duman
        run: |
          createdb -h 127.0.0.1 -U ati_test ati_uretim_duman
          uv sync --locked --no-dev --no-editable
          uv run --no-sync ati-cloud-migrate
          uv run --no-sync ati-cloud-api --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          uv run --no-sync ati-cloud-relay --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/relay.log" 2>&1 &
          uv run --no-sync ati-cloud-mail --help > /dev/null
          wait_for() { for i in $(seq 1 60); do curl -fsS "$1" > /dev/null 2>&1 && return 0; sleep 1; done; return 1; }
          wait_for http://127.0.0.1:8000/ready || { cat "$RUNNER_TEMP/api.log"; exit 1; }
          wait_for http://127.0.0.1:8765/health || { cat "$RUNNER_TEMP/relay.log"; exit 1; }
          curl -fsS http://127.0.0.1:8000/v1/releases

  soak:
    # Her motor değişikliğinde Windows'ta çalışır (windows.yml); Linux sürümü elle başlatılır.
    name: Motor dayanıklılık (Linux, 3 dk)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Bellek, görev sayısı, olay döngüsü gecikmesi, API hataları, acil durdurma süresi
        # --debug-slow: olay döngüsünü 200 ms'den uzun tutan adım olursa adıyla yazılır.
        run: uv run python scripts/soak.py --minutes 3 --sample-s 10 --debug-slow

  license-e2e:
    name: Lisans uçtan uca (motor + bulut API + PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ati_test
          POSTGRES_PASSWORD: ati_test
          POSTGRES_DB: ati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ATI_TEST_DATABASE_URL: postgresql://ati_test:ati_test@127.0.0.1:5432/ati_test
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Bulut bağımlılıkları
        working-directory: cloud
        run: uv sync --locked
      - name: Gerçek bulut lisans API'si ile motor (etkinleştirme, kapı, dondurma, cihaz limiti)
        run: uv run pytest tests/test_license_e2e.py -v
