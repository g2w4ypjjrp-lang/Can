name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Motor (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # Motor üretimde Windows'ta çalışır; Windows testleri DPAPI ve dosya kilidini de doğrular.
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  cloud:
    name: Bulut servisi (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ati_test
          POSTGRES_PASSWORD: ati_test
          POSTGRES_DB: ati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ATI_TEST_DATABASE_URL: postgresql://ati_test:ati_test@127.0.0.1:5432/ati_test
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Yük testi (duman; lisans uç noktaları ve aktarma servisi, gerçek sunucular)
        run: uv run python scripts/load_test.py --quick
      - name: Felaket kurtarma tatbikatı (pg_dump → pg_restore → iş sürekliliği)
        run: |
          pg_dump --version
          uv run python scripts/dr_drill.py

  soak:
    name: Motor dayanıklılık (${{ matrix.os }}, 3 dk)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Bellek, görev sayısı, olay döngüsü gecikmesi, API hataları, acil durdurma süresi
        # --debug-slow: olay döngüsünü 200 ms'den uzun tutan adım olursa adıyla yazılır.
        run: uv run python scripts/soak.py --minutes 3 --sample-s 10 --debug-slow

  license-e2e:
    name: Lisans uçtan uca (motor + bulut API + PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ati_test
          POSTGRES_PASSWORD: ati_test
          POSTGRES_DB: ati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ATI_TEST_DATABASE_URL: postgresql://ati_test:ati_test@127.0.0.1:5432/ati_test
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Bulut bağımlılıkları
        working-directory: cloud
        run: uv sync --locked
      - name: Gerçek bulut lisans API'si ile motor (etkinleştirme, kapı, dondurma, cihaz limiti)
        run: uv run pytest tests/test_license_e2e.py -v

  containers:
    name: Üretim imajları (web + bulut, duman testi)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ati_test
          POSTGRES_PASSWORD: ati_test
          POSTGRES_DB: ati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DSN: postgresql://ati_test:ati_test@127.0.0.1:5432/ati_test
    steps:
      - uses: actions/checkout@v4
      - name: İmajları derle
        run: |
          docker build -t ati-cloud cloud/
          docker build -t ati-web web/
      # Yalnızca üretim bağımlılıklarıyla kurulmuş imajda süreçler açılmalı (geliştirme
      # bağımlılığına yanlışlıkla dayanan kod burada yakalanır).
      - name: Geçişler, API, aktarma servisi ve site (root olmayan kullanıcı)
        run: |
          docker run --rm --network host -e ATI_DATABASE_URL="$DSN" ati-cloud ati-cloud-migrate
          docker run -d --name api --network host -e ATI_DATABASE_URL="$DSN" ati-cloud \
            ati-cloud-api --host 127.0.0.1 --port 8000
          docker run -d --name relay --network host ati-cloud ati-cloud-relay --host 127.0.0.1 --port 8765
          docker run -d --name web --network host -e PORT=3000 -e ATI_PLANS_REVALIDATE_S=0 \
            -e ATI_PUBLIC_API_URL=http://127.0.0.1:8000 -e ATI_PUBLIC_WEB_URL=http://127.0.0.1:3000 ati-web
          wait_for() { for i in $(seq 1 60); do curl -fsS "$1" > /dev/null 2>&1 && return 0; sleep 1; done; return 1; }
          wait_for http://127.0.0.1:8000/ready || { docker logs api; exit 1; }
          wait_for http://127.0.0.1:8765/health || { docker logs relay; exit 1; }
          wait_for http://127.0.0.1:3000/robots.txt || { docker logs web; exit 1; }
          for path in / /indir /paketler /yonetim/giris; do
            curl -fsS -o /dev/null "http://127.0.0.1:3000$path" || { docker logs web; exit 1; }
          done
          curl -fsS http://127.0.0.1:8000/v1/releases
          curl -fsS http://127.0.0.1:3000/indir | grep -q "İndirme yakında açılacak"
          test "$(docker exec api id -u)" != 0 && test "$(docker exec web id -u)" != 0
          docker images --format '{{.Repository}} {{.Size}}' | grep ati-
