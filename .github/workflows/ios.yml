name: iOS

# Çekirdek testleri (Linux) iOS/protokol değişince çalışır. Uygulama ve arayüz testleri macOS
# dakikası (ücretsiz kotadan 10 kat) harcadığı için yalnızca elle başlatılır: Actions → iOS →
# Run workflow.
on:
  push:
    branches-ignore: [ana]
    paths:
      - "ios/**"
      - "shared/protocol/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Çekirdek (Linux, swift test)
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - name: ATICore testleri (protokol, imza, ortak test vektörleri, denetleyici)
        working-directory: ios/ATICore
        run: swift test

  app:
    name: iOS uygulaması (macOS, XCTest + arayüz testleri)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode sürümü
        run: xcodebuild -version
      - name: ATICore testleri (CryptoKit)
        working-directory: ios/ATICore
        run: swift test
      - name: Xcode projesi (XcodeGen)
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Simülatör seç
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          phones = [(rt, d) for rt, ds in data.items() if 'iOS' in rt for d in ds if d['name'].startswith('iPhone')]
          # En yeni iOS; tercihen standart boyutlu (SE/mini olmayan) iPhone.
          phones.sort(key=lambda x: (x[0], 'SE' not in x[1]['name'] and 'mini' not in x[1]['name']))
          print(phones[-1][1]['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
      - name: Derle ve arayüz testlerini çalıştır (imzasız, simülatör)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project ATI.xcodeproj -scheme ATI \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tail -n 200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          retention-days: 7
