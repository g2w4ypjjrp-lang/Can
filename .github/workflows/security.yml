name: Güvenlik taraması

# Aşama 18: bağımlılık güvenlik açıkları (Python, npm, Rust) ve gizli bilgi taraması.
# Her gönderimde ve haftalık çalışır: kod değişmese de yeni yayımlanan açıklar yakalanır.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # Pazartesi 07:23 (TSİ)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gizli bilgi taraması (dosyalar + tüm geçmiş)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tarayıcının öz sınaması
        run: python3 scripts/secret_scan.py --self-test
      - name: İzlenen dosyalar ve git geçmişi
        run: python3 scripts/secret_scan.py --history

  python:
    name: Python bağımlılıkları (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [engine, cloud]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Kilit dosyasındaki tüm paketler (geliştirme dahil)
        run: uv export --locked --no-hashes --no-emit-project --all-groups -q > "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit (PyPI güvenlik açığı veritabanı)
        run: uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps --progress-spinner off

  npm:
    name: npm bağımlılıkları (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [web, desktop]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (geliştirme araçları dahil, orta ve üzeri)
        run: npm audit --audit-level=moderate

  rust:
    name: Rust bağımlılıkları (masaüstü kabuğu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit (RustSec)
        working-directory: desktop/src-tauri
        # Yalnızca güvenlik açıkları işi düşürür. "unmaintained/unsound" uyarıları Tauri'nin
        # Linux GTK/D-Bus yığınından gelir ve Windows ürününe derlenmez (docs/06).
        run: cargo audit
