[project]
name = "bizcenter"
version = "0.1.0"
description = "AI Business Center - API servisi"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyjwt[crypto]>=2.9",
    "anthropic>=2.14.0",
    "celery[redis]>=5.7.0",
    "croniter>=7.0.0",
    "cryptography>=50.0.2",
    "httpx>=0.29.0",
    "redis>=8.2.0",
]

[project.scripts]
bizcenter-api = "bizcenter.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "fakeredis>=2.41.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bizcenter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI Depends() deyimi
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "UP031", "SIM117", "E501", "F811"]  # F811: pytest fixture içe aktarımı
