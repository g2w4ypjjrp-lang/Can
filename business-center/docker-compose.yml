# Servisler birbirinden bağımsız çalışır. Veritabanı ve Auth: Supabase (barındırılan).
services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on: [redis]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      INTERNAL_API_URL: http://backend:8000
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on: [backend]

  # Phase 2'de Celery görev kuyruğu ve dağıtık hız sınırı için kullanılacak.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped

volumes:
  redis-data:
