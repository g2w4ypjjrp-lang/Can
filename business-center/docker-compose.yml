# Servisler birbirinden bağımsız çalışır. Veritabanı ve Auth: Supabase (barındırılan).
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      BC_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on: [redis]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      INTERNAL_API_URL: http://backend:8000
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on: [backend]

  # Ajan görevlerini çalıştırır (CEO + uzmanlar). Ölçeklemek için: docker compose up --scale worker=3
  worker:
    build: ./backend
    env_file: .env
    environment:
      BC_REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "bizcenter.worker", "worker", "-l", "info", "--concurrency", "2"]
    restart: unless-stopped
    depends_on: [redis]

  # Zamanlayıcı: her dakika otomasyonları, onay süre aşımını ve takılı görevleri işler. Yalnızca 1 kopya çalışmalı.
  beat:
    build: ./backend
    env_file: .env
    environment:
      BC_REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "bizcenter.worker", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    restart: unless-stopped
    depends_on: [redis]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped

volumes:
  redis-data:
