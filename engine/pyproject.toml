[project]
name = "ati-engine"
version = "0.1.0"
description = "AI Trading Intelligence - yerel işlem motoru (Windows üzerinde çalışır)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "msgspec>=0.19",
    "structlog>=24.4",
    "cryptography>=43",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "httpx>=0.27",
    "duckdb>=1.1",
]

[project.scripts]
ati-engine = "ati_engine.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ati_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "slow: uzun süren testler (alt süreç başlatır)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "C4", "PIE"]
ignore = [
    "RUF001",  # Türkçe metinlerde belirsiz karakter uyarıları
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S105", "S106", "S311", "S603", "S607", "E501", "PT018",
    "ASYNC110", "ASYNC230", "ASYNC251",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ati_engine"]
