# Production stack on a single VPS. Database/Auth/Storage = Supabase (hosted).
#   docker compose --env-file .env up -d --build
#   docker compose --env-file .env --profile migrate run --rm migrate
name: etsy-ai-store-manager

x-app: &app
  restart: unless-stopped
  init: true
  env_file: .env
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }
  security_opt: ['no-new-privileges:true']
  read_only: true
  tmpfs: ['/tmp']

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      retries: 5
    environment: { REDIS_PASSWORD: '${REDIS_PASSWORD}' }
    networks: [internal]

  api:
    <<: *app
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, target: api }
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_PORT: '4000'
    depends_on: { redis: { condition: service_healthy } }
    networks: [internal]

  worker:
    <<: *app
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, target: worker }
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on: { redis: { condition: service_healthy } }
    networks: [internal]

  web:
    <<: *app
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    tmpfs: ['/tmp', '/app/apps/web/.next/cache']
    depends_on: [api]
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    environment: { DOMAIN: '${DOMAIN}' }
    depends_on: [web, api]
    networks: [internal]

  certbot:
    image: certbot/certbot:v3.1.0
    profiles: [certbot]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: ['certbot']

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, target: migrate }
    profiles: [migrate]
    env_file: .env
    environment: { NODE_ENV: production }
    networks: [internal]

volumes:
  redis-data:
  certbot-webroot:

networks:
  internal:
