# Replace example.com with your domain (or render from $DOMAIN with envsubst).
upstream web_upstream { server web:3000; keepalive 16; }
upstream api_upstream { server api:4000; keepalive 16; }

server {
  listen 80;
  server_name example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name example.com;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api_upstream;
    proxy_read_timeout 60s;
  }

  # Swagger: keep private (allow your IP or disable SWAGGER_ENABLED in production)
  location /docs {
    # allow 203.0.113.10;
    deny all;
    proxy_pass http://api_upstream;
  }

  location ~ ^/(login|signup)$ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://web_upstream;
  }

  location / {
    proxy_pass http://web_upstream;
  }
}
