worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;   # design uploads (Phase 6)

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_user_agent" rt=$request_time rid=$request_id';
  access_log /var/log/nginx/access.log main;

  # Edge rate limits (the API has its own per-user limiter too)
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  include /etc/nginx/conf.d/*.conf;
}
